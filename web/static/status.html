<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gameserver · Status</title>
<link rel="icon" type="image/png" sizes="32x32" href="img/icon-32.png">
<link rel="apple-touch-icon" href="img/icon-180.png">
<link rel="stylesheet" href="status.css">
</head>
<body>
<header class="top">
  <img src="img/logo-mark.png" alt="" width="44" height="44">
  <div><h1 id="title">Gameserver</h1><p id="note" class="muted" hidden></p></div>
</header>
<main>
  <p id="msg" class="muted">Lädt …</p>
  <div id="list" class="list"></div>
  <section id="players" class="events" hidden>
    <div class="ev-head"><h2>Spieler</h2><span class="muted small" id="plSum"></span></div>
    <div class="ptbl-wrap"><table class="ptbl"><thead><tr><th>Spieler</th><th>Spielzeit</th><th>Am liebsten auf</th><th>Dabei seit</th><th>Zuletzt</th></tr></thead><tbody id="plRows"></tbody></table></div>
  </section>
  <section id="events" class="events" hidden>
    <div class="ev-head"><h2>Kommende Events</h2><a id="cal" class="btn" href="#" hidden>Im Kalender abonnieren</a></div>
    <ul id="evList"></ul>
  </section>
  <section id="wishes" class="events" hidden>
    <div class="ev-head"><h2>Wünsche</h2><span class="muted small">Was soll als Nächstes kommen? Stimm ab oder wünsch dir was.</span></div>
    <form id="wiForm" class="wi-form" autocomplete="off">
      <input id="wiTitle" maxlength="80" placeholder="z. B. ein Satisfactory-Server" aria-label="Dein Wunsch" required>
      <select id="wiKind" aria-label="Art"><option value="spiel">Spiel</option><option value="mod">Mod</option><option value="sonstiges">Sonstiges</option></select>
      <input id="wiBy" maxlength="30" placeholder="Dein Name (optional)" aria-label="Dein Name">
      <input id="wiWeb" name="website" tabindex="-1" autocomplete="off" class="hp" aria-hidden="true">
      <button class="btn primary" type="submit">Wünschen</button>
    </form>
    <p id="wiMsg" class="small" hidden></p>
    <ul id="wiList" class="wi-list"></ul>
  </section>
</main>
<footer class="muted">Aktualisiert sich von selbst · <span id="upd"></span> · betrieben mit Bytewise Panel</footer>
<script src="i18n.js"></script>
<script src="status.js"></script>
</body>
</html>
