name: Bug report / Fehler melden
description: Something does not work / Etwas funktioniert nicht
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Panel version / Version
      description: Bottom left in the panel / unten links im Panel
      placeholder: v0.42.0
    validations:
      required: true
  - type: input
    id: game
    attributes:
      label: Game / Spiel
      placeholder: Valheim, Minecraft Java …
  - type: textarea
    id: what
    attributes:
      label: What happened? / Was ist passiert?
      description: What did you do, what did you expect, what happened instead?
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Console lines or `journalctl -u gamepanel -n 100`. Remove passwords and IP addresses. / Passwörter und IPs vorher entfernen.
      render: text
  - type: input
    id: system
    attributes:
      label: System
      placeholder: Debian 12, Docker 27, Proxmox VM
