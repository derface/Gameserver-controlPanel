name: Game request / Spielwunsch
description: A game you would like as a template / Ein Spiel, das eine Vorlage bekommen soll
labels: [game]
body:
  - type: input
    id: game
    attributes:
      label: Game / Spiel
    validations:
      required: true
  - type: input
    id: steam
    attributes:
      label: Steam app ID of the dedicated server (if any)
      placeholder: "896660"
  - type: textarea
    id: notes
    attributes:
      label: Notes / Hinweise
      description: Ports, links to server docs, Linux or Windows-only, needs a Steam login …
